name: 배치1 매물수집

# 배치1: 네이버 매물 수집 → 구글시트 『매물장』 전량 교체 적재
# 주의: GitHub Actions 러너는 데이터센터 IP라 네이버가 차단/빈결과를 줄 수 있음 (PRD §11).
#       0건 수집 시 코드가 시트를 건드리지 않으므로 시트 손상은 없음.

on:
  # 자동 스케줄 비활성화: 네이버가 GitHub 데이터센터 IP를 차단하므로(Playwright 시절
  # ERR_CONNECTION_RESET) 클라우드 정기 실행은 불가. 로컬 PC 작업 스케줄러로 수집한다.
  # API 직접 호출로 바꾼 뒤 러너에서 되는지는 아직 확인 안 함 — 수동 실행으로 시험해볼 것.
  # schedule:
  #   - cron: '0 23 * * *'   # 08:00 KST
  workflow_dispatch:   # 수동 실행 버튼만 유지 (프록시/자가호스트 러너 테스트용)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 수집이 API 직접 호출로 바뀌어 브라우저 바이너리는 받지 않는다 (2026-08-05).

      - name: 서비스 계정 키 파일 생성 (시크릿에서)
        run: printf '%s' "$GCP_SA_KEY" > sa_key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: 배치1 실행
        env:
          GSPREAD_KEY_FILE: sa_key.json
          SPREADSHEET_ID: '1l6gYrwWySZyRCbcxBq0pxqpLauA6VClomSwC0UNtMQg'
          SPREADSHEET_NAME: 네이버_단지별_부동단_매물
          CONFIG_SHEET: 설정
          MAEMULJANG_SHEET: 매물장
          WATCH_LABEL: 감시단지
          LOG_SHEET: 실행로그
          PYTHONUTF8: '1'
        run: python main.py

      - name: 키 파일 정리
        if: always()
        run: rm -f sa_key.json
